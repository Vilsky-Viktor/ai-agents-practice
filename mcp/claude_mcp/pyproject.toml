[tool.poetry]
name = "pr-agent-slack"
version = "3.0.0"
description = "MCP server with Slack notifications integrating Tools and Prompts"
authors = ["viktor-vilskyi <viktor@terrificlive.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
mcp = {extras = ["cli"], version = "^1.30.0"}
aiohttp = "^3.10.0"
requests = "^2.32.0"
python-dotenv = "^1.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.21.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
